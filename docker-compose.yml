version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-cost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aicost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aicost_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-aicost}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aicost} -d ${POSTGRES_DB:-aicost}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-cost-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: ai-cost-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aicost}:${POSTGRES_PASSWORD:-aicost_secure_pass}@postgres:5432/${POSTGRES_DB:-aicost}
      REDIS_URL: redis://redis:6379
      API_PORT: 3001
      API_HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:-ai-cost-super-secret-key-change-in-production}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-90}
    ports:
      - "3001:3001"

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    container_name: ai-cost-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aicost}:${POSTGRES_PASSWORD:-aicost_secure_pass}@postgres:5432/${POSTGRES_DB:-aicost}
      REDIS_URL: redis://redis:6379
      GATEWAY_PORT: 4000
      GATEWAY_HOST: 0.0.0.0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      FAIL_OPEN: ${FAIL_OPEN:-true}
    ports:
      - "4000:4000"

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: ai-cost-dashboard
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
